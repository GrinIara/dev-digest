# evals suite — the Claude Code harness evals (@devdigest/evals): skills, subagents and the
# workflow tier (CLAUDE.md / AGENTS.md + on-disk config), on OpenRouter models.
#
# Only the suites a PR touches run — evals/scripts/ci-detect.mjs maps changed files onto them
# (a changed skill/agent without written evals is logged as "SKIP … (no evals)", not failed).
#
# Models — resolved as: manual-run input → repo Actions variable → default below. Each judge is a
# different family from its task model, to soften self-preference.
#   skills   : EVAL_SKILL_MODEL       (default anthropic/claude-haiku-4.5 — DeepSeek mis-ranked
#                                      dependency-checker priorities in about half the runs)
#              EVAL_SKILL_JUDGE_MODEL (default google/gemini-2.5-flash)
#   agents   : EVAL_MODEL             (default deepseek/deepseek-chat — cheapest model that passes
#                                      the agent cases, see evals/README.md)
#              EVAL_JUDGE_MODEL       (default anthropic/claude-haiku-4.5 — Gemini Flash misread
#                                      conditional practices)
#   workflow : EVAL_WORKFLOW_MODEL    (default anthropic/claude-haiku-4.5 — Gemini Flash skipped
#                                      the documented reads, 2/6 vs Haiku's 4/6)
# Change them for every PR in Settings → Secrets and variables → Actions → Variables, or for one
# run via Actions → evals → Run workflow. Requires the OPENROUTER_API_KEY Actions secret.
name: evals

on:
  pull_request:
    paths:
      - '.claude/**'
      - 'CLAUDE.md'
      - '**/AGENTS.md'
      - 'evals/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Suites to run: all | skills | agents | workflow'
        type: choice
        options: [all, skills, agents, workflow]
        default: all
      skill_model:
        description: 'EVAL_SKILL_MODEL for skills (OpenRouter slug; empty = repo variable / default)'
        required: false
      skill_judge_model:
        description: 'EVAL_SKILL_JUDGE_MODEL (empty = repo variable / default)'
        required: false
      model:
        description: 'EVAL_MODEL for agents (OpenRouter slug; empty = repo variable / default)'
        required: false
      judge_model:
        description: 'EVAL_JUDGE_MODEL for agents (empty = repo variable / default)'
        required: false
      workflow_model:
        description: 'EVAL_WORKFLOW_MODEL for the workflow tier (empty = repo variable / default)'
        required: false

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter
  OPENROUTER_BASE_URL: http://localhost:4000 # the LiteLLM proxy from evals/proxy/
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  detect:
    name: detect changed suites
    runs-on: ubuntu-latest
    outputs:
      skill_paths: ${{ steps.detect.outputs.skill_paths }}
      agent_paths: ${{ steps.detect.outputs.agent_paths }}
      run_workflow: ${{ steps.detect.outputs.run_workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVAL_TARGETS: ${{ inputs.targets || 'auto' }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          else
            CHANGED_FILES=""
          fi
          export CHANGED_FILES
          node evals/scripts/ci-detect.mjs

  # No model, no tokens: typecheck, the static SKILL.md gate and the statistics unit tests.
  static:
    name: typecheck + static gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm eval:quality
      - run: pnpm exec vitest run src/

  skill-evals:
    name: skill evals
    needs: [detect, static]
    if: needs.detect.outputs.skill_paths != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_MODEL: ${{ inputs.skill_model || vars.EVAL_SKILL_MODEL || 'anthropic/claude-haiku-4.5' }}
      EVAL_JUDGE_MODEL: ${{ inputs.skill_judge_model || vars.EVAL_SKILL_JUDGE_MODEL || 'google/gemini-2.5-flash' }}
      EVAL_PATHS: ${{ needs.detect.outputs.skill_paths }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Skill cases call OpenRouter directly; the proxy just keeps one base URL for every tier.
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait

      - name: run evals
        run: |
          echo "model=$EVAL_MODEL judge=$EVAL_JUDGE_MODEL paths=$EVAL_PATHS"
          # Sequential + one retry: OpenRouter throttles parallel sessions (evals/README.md).
          pnpm exec vitest run --no-file-parallelism --retry 1 $EVAL_PATHS

      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-skills
          path: evals/results/
          if-no-files-found: ignore

  agent-evals:
    name: agent evals
    needs: [detect, static]
    if: needs.detect.outputs.agent_paths != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_MODEL: ${{ inputs.model || vars.EVAL_MODEL || 'deepseek/deepseek-chat' }}
      EVAL_JUDGE_MODEL: ${{ inputs.judge_model || vars.EVAL_JUDGE_MODEL || 'anthropic/claude-haiku-4.5' }}
      EVAL_PATHS: ${{ needs.detect.outputs.agent_paths }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Agent cases run inside the Claude Agent SDK, which needs the Anthropic↔OpenAI proxy.
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait

      - name: run evals
        run: |
          echo "model=$EVAL_MODEL judge=$EVAL_JUDGE_MODEL paths=$EVAL_PATHS"
          # Sequential + one retry: OpenRouter throttles parallel sessions (evals/README.md).
          pnpm exec vitest run --no-file-parallelism --retry 1 $EVAL_PATHS

      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-agents
          path: evals/results/
          if-no-files-found: ignore

  workflow-evals:
    name: workflow evals
    needs: [detect, static]
    if: needs.detect.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_MODEL: ${{ inputs.workflow_model || vars.EVAL_WORKFLOW_MODEL || 'anthropic/claude-haiku-4.5' }}
      EVAL_JUDGE_MODEL: ${{ inputs.workflow_model || vars.EVAL_WORKFLOW_MODEL || 'anthropic/claude-haiku-4.5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait

      - name: run evals
        run: |
          echo "model=$EVAL_MODEL"
          pnpm exec vitest run --no-file-parallelism --retry 1 workflow/

      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-workflow
          path: evals/results/
          if-no-files-found: ignore
